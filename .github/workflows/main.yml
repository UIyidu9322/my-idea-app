name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install --upgrade pip
        pip install flet

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # ✨ 核心修复：提前帮系统把 Flutter 环境装好，防止弹窗提问卡死
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Build APK with Flet
      run: |
        # 预先同意协议（以防万一）
        flet config set flutter-licenses true || true
        # 真正开始打包
        flet build apk --verbose
        # 允许命令静默通过提问
        echo "y" | flet build apk --verbose || flet build apk --verbose

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-android-app-apk
        path: build/apk/*.apk
