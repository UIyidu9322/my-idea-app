name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install --upgrade pip
        pip install flet

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    # ✨ 核心改动：用 flet 导出纯粹的 flutter 项目，再用 flutter 官方原生命令打包
    # 原生 flutter 编译命令默认会自动处理全部许可，绝对不会在后台弹出任何无意义的 [y/n] 提问
     Cav
    - name: Export and Build with Flutter Native
      run: |
        # 1. 让 flet 把 python 代码转换为原生的 flutter 代码目录（默认会生成在 build 目录或当前目录）
        flet pack main.py --as-flutter || true
        
        # 2. 如果项目已经包含了 flutter 工程结构，直接接受所有协议并打包
        flutter doctor --android-licenses <<< "y" || true
        
        # 3. 运行绝对静默的原生安卓编译命令
        flutter build apk --release --no-pub

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-android-app-apk
        # 兼容两种可能生成的原生打包路径
        path: |
          build/app/outputs/flutter-apk/*.apk
          build/apk/*.apk
