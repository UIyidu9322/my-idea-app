name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install --upgrade pip
        pip install flet

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Export and Build with Flutter Native
      run: |
        # 1. 尝试使用新版 Flet 命令直接静默打包
        flet build apk --verbose || true
        
        # 2. 如果上面失败了，降级采用原生编译
        if [ ! -d "build/apk" ]; then
          flutter doctor --android-licenses <<< "y" || true
          flutter build apk --release --no-pub || true
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-android-app-apk
        path: |
          build/app/outputs/flutter-apk/*.apk
          build/apk/*.apk
