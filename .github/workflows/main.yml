name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install --upgrade pip
        pip install flet
        # 预先同意 Flet 的用户协议，防止它在服务器后台弹出提问导致卡死报错
        flet config set flutter-licenses true || true

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build APK with Flet
      run: |
        # 增加 --verbose 打印详细日志，万一报错能看清原因
        # 暂时去掉复杂的权限声明，先用最基础的命令确保能顺利吐出 APK
        flet build apk --verbose

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-android-app-apk
        path: build/apk/*.apk
