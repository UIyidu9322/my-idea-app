name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许手动点击按钮触发打包

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Flet CLI
      run: |
        pip install --upgrade pip
        pip install flet

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build APK with Flet
      run: |
        # 使用 flet build apk 命令打包
        # --permissions 申请了读写存储和管理所有文件的权限（适合自用应用）
        flet build apk --release --permissions READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE,MANAGE_EXTERNAL_STORAGE

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-android-app-apk
        path: build/apk/*.apk
